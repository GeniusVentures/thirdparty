name: Multiplatform build and upload

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        type: string
      build_android_arm64v8a_release:
        description: 'Build Android arm64-v8a Release'
        required: true
        default: true
        type: boolean
      build_android_arm64v8a_debug:
        description: 'Build Android arm64-v8a Debug'
        required: true
        default: true
        type: boolean
      build_android_armv7a_release:
        description: 'Build Android armeabi-v7a Release'
        required: true
        default: true
        type: boolean
      build_android_armv7a_debug:
        description: 'Build Android armeabi-v7a Debug'
        required: true
        default: true
        type: boolean
      build_ios_release:
        description: 'Build iOS Release'
        required: true
        default: true
        type: boolean
      build_ios_debug:
        description: 'Build iOS Debug'
        required: true
        default: true
        type: boolean
      build_osx_release:
        description: 'Build OSX Release'
        required: true
        default: true
        type: boolean
      build_osx_debug:
        description: 'Build OSX Debug'
        required: true
        default: true
        type: boolean
      build_linux_x86_64_release:
        description: 'Build Linux x86_64 Release'
        required: true
        default: true
        type: boolean
      build_linux_x86_64_debug:
        description: 'Build Linux x86_64 Debug'
        required: true
        default: true
        type: boolean
      build_linux_aarch64_release:
        description: 'Build Linux aarch64 Release'
        required: true
        default: true
        type: boolean
      build_linux_aarch64_debug:
        description: 'Build Linux aarch64 Debug'
        required: true
        default: true
        type: boolean
      build_windows_release:
        description: 'Build Windows Release'
        required: true
        default: true
        type: boolean
      build_windows_debug:
        description: 'Build Windows Debug'
        required: true
        default: true
        type: boolean
      sgns_enable_release_symbols:
        description: 'Enable SGNS release symbols in CMake configure'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: gen
        env:
          GATED: ${{ github.event_name == 'workflow_dispatch' }}
          BUILD_ANDROID_ARM64V8A_RELEASE: ${{ inputs.build_android_arm64v8a_release }}
          BUILD_ANDROID_ARM64V8A_DEBUG: ${{ inputs.build_android_arm64v8a_debug }}
          BUILD_ANDROID_ARMV7A_RELEASE: ${{ inputs.build_android_armv7a_release }}
          BUILD_ANDROID_ARMV7A_DEBUG: ${{ inputs.build_android_armv7a_debug }}
          BUILD_IOS_RELEASE: ${{ inputs.build_ios_release }}
          BUILD_IOS_DEBUG: ${{ inputs.build_ios_debug }}
          BUILD_OSX_RELEASE: ${{ inputs.build_osx_release }}
          BUILD_OSX_DEBUG: ${{ inputs.build_osx_debug }}
          BUILD_LINUX_X86_64_RELEASE: ${{ inputs.build_linux_x86_64_release }}
          BUILD_LINUX_X86_64_DEBUG: ${{ inputs.build_linux_x86_64_debug }}
          BUILD_LINUX_AARCH64_RELEASE: ${{ inputs.build_linux_aarch64_release }}
          BUILD_LINUX_AARCH64_DEBUG: ${{ inputs.build_linux_aarch64_debug }}
          BUILD_WINDOWS_RELEASE: ${{ inputs.build_windows_release }}
          BUILD_WINDOWS_DEBUG: ${{ inputs.build_windows_debug }}
        run: |
          set -euo pipefail

          # One entry per supported target/ABI/build-type combination.
          # `toggle` names the workflow_dispatch input that enables the entry;
          # it is stripped before the matrix is handed to the build workflow.
          MATRIX='[
            {"target":"Android","build-type":"Release","abi":"arm64-v8a","runner_key":"linux_x64","toggle":"BUILD_ANDROID_ARM64V8A_RELEASE"},
            {"target":"Android","build-type":"Debug","abi":"arm64-v8a","runner_key":"linux_x64","toggle":"BUILD_ANDROID_ARM64V8A_DEBUG"},
            {"target":"Android","build-type":"Release","abi":"armeabi-v7a","runner_key":"linux_x64","toggle":"BUILD_ANDROID_ARMV7A_RELEASE"},
            {"target":"Android","build-type":"Debug","abi":"armeabi-v7a","runner_key":"linux_x64","toggle":"BUILD_ANDROID_ARMV7A_DEBUG"},
            {"target":"iOS","build-type":"Release","abi":"","runner_key":"mac","toggle":"BUILD_IOS_RELEASE"},
            {"target":"iOS","build-type":"Debug","abi":"","runner_key":"mac","toggle":"BUILD_IOS_DEBUG"},
            {"target":"OSX","build-type":"Release","abi":"","runner_key":"mac","toggle":"BUILD_OSX_RELEASE"},
            {"target":"OSX","build-type":"Debug","abi":"","runner_key":"mac","toggle":"BUILD_OSX_DEBUG"},
            {"target":"Linux","build-type":"Release","abi":"x86_64","runner_key":"linux_x64","toggle":"BUILD_LINUX_X86_64_RELEASE","container":"ghcr.io/geniusventures/debian-bullseye:latest"},
            {"target":"Linux","build-type":"Debug","abi":"x86_64","runner_key":"linux_x64","toggle":"BUILD_LINUX_X86_64_DEBUG","container":"ghcr.io/geniusventures/debian-bullseye:latest"},
            {"target":"Linux","build-type":"Release","abi":"aarch64","runner_key":"linux_arm","toggle":"BUILD_LINUX_AARCH64_RELEASE","container":"ghcr.io/geniusventures/debian-bullseye:latest"},
            {"target":"Linux","build-type":"Debug","abi":"aarch64","runner_key":"linux_arm","toggle":"BUILD_LINUX_AARCH64_DEBUG","container":"ghcr.io/geniusventures/debian-bullseye:latest"},
            {"target":"Windows","build-type":"Release","abi":"","runner_key":"windows","toggle":"BUILD_WINDOWS_RELEASE"},
            {"target":"Windows","build-type":"Debug","abi":"","runner_key":"windows","toggle":"BUILD_WINDOWS_DEBUG"}
          ]'

          # On workflow_dispatch, drop the combinations whose toggle was unchecked.
          if [ "$GATED" = "true" ]; then
            MATRIX=$(jq -c '[ .[] | select((env[.toggle] // "false") == "true") ]' <<<"$MATRIX")
          fi

          # The build workflow's strategy consumes the canonical {include: [...]} form.
          MATRIX=$(jq -c '{include: [.[] | del(.toggle)]}' <<<"$MATRIX")

          COUNT=$(jq '.include | length' <<<"$MATRIX")
          echo "Building $COUNT combinations:"
          jq -r '.include[] | "- \(.target) \(.abi) \(.["build-type"])"' <<<"$MATRIX"

          if [ "$COUNT" -eq 0 ]; then
            echo "No target combinations enabled; nothing to build." >&2
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build and upload
    needs: prepare
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      upload: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || inputs.tag != '' }}
      release-tag: ${{ inputs.tag }}
      sgns_enable_release_symbols: ${{ inputs.sgns_enable_release_symbols }}
    secrets: inherit
